name: build-ffmpeg
on:
  push:
    branches: master
    paths-ignore:
      - '**.md'
      - '**.rst'
      - '**.txt'
  pull_request:
    branches: master
    paths-ignore:
      - '**.md'
      - '**.rst'
      - '**.txt'
  release:
    types: [published]
  workflow_dispatch:
jobs:
  fan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Make cache file
        run: python scripts/cache.py
      - name: Cache tarballs
        id: cache-tarballs
        uses: actions/cache@v6
        with:
          path: source
          key: tarballs-${{ hashFiles('cache.txt') }}
      - name: Grab
        if: steps.cache-tarballs.outputs.cache-hit != 'true'
        run: python scripts/grab.py
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: deps
          path: source/*
          if-no-files-found: error
  build:
    needs: fan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # torchcodec-ffmpeg: build only for the platforms TorchCodec publishes
        # wheels for (macOS arm64, Linux x86_64 and aarch64, Windows x86_64)
        include:
          - os: macos-15
            arch: arm64
            shell: bash
          # - os: macos-15-intel
          #   arch: x86_64
          #   shell: bash
          - os: ubuntu-24.04-arm
            arch: aarch64
            shell: bash
          - os: ubuntu-24.04
            arch: x86_64
            shell: bash
          - os: windows-latest
            arch: x86_64
            shell: 'msys2 {0}'
            msys_prefix: mingw-w64-x86_64
            msys_system: MINGW64
          # - os: windows-11-arm
          #   arch: arm64
          #   shell: 'msys2 {0}'
          #   msys_prefix: mingw-w64-clang-aarch64
          #   msys_system: CLANGARM64
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Get sources
        uses: actions/download-artifact@v8
        with:
          name: deps
          path: source
      - name: Set deployment target
        if: runner.os == 'macOS'
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV
          else
            echo "MACOSX_DEPLOYMENT_TARGET=14.0" >> $GITHUB_ENV
          fi
      - name: Install packages for macOS
        if: runner.os == 'macOS'
        run: |
          brew unlink gettext libidn2 libpng libtiff libunistring libx11 libxcb libxdmcp
      # Build nasm once for both the manylinux and musllinux containers
      - name: Build nasm
        if: runner.os == 'Linux' && matrix.arch == 'x86_64'
        run: python scripts/build-nasm.py tools/bin
      # torchcodec-ffmpeg: clang compiles the CUDA kernels of scale_cuda (--enable-cuda-llvm)
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          install: >-
            base-devel
            openssl-devel
            ${{ matrix.msys_prefix }}-pkgconf
            ${{ matrix.msys_system == 'CLANGARM64' && format('{0}-clang', matrix.msys_prefix) || format('{0}-gcc {0}-nasm', matrix.msys_prefix) }}
            ${{ matrix.msys_system == 'MINGW64' && format('{0}-clang', matrix.msys_prefix) || '' }}
          msystem: ${{ matrix.msys_system }}
          path-type: inherit
      - name: Build FFmpeg
        env:
          CIBW_ARCHS: ${{ matrix.msys_system == 'CLANGARM64' && 'ARM64' || (matrix.msys_prefix && 'AMD64' || matrix.arch) }}
          CIBW_BEFORE_BUILD: python scripts/build-ffmpeg.py /tmp/vendor
          CIBW_BEFORE_BUILD_WINDOWS: python scripts\build-ffmpeg.py C:\cibw\vendor
          # torchcodec-ffmpeg: the wheel is built once per platform and tested
          # with every Python version TorchCodec publishes wheels for
          # CIBW_BUILD: cp312-*
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-*
          # torchcodec-ffmpeg: TorchCodec publishes no musllinux wheels
          CIBW_SKIP: "*-musllinux_*"
          # cibuildwheel copies the project to /project in each container
          CIBW_ENVIRONMENT_LINUX: PATH=/project/tools/bin:$PATH
          # torchcodec-ffmpeg: the wheel is not repaired. auditwheel, delocate and
          # delvewheel would rename the bundled libraries, which TorchCodec then
          # could not find. setup.py sets their rpath instead.
          # CIBW_REPAIR_WHEEL_COMMAND_LINUX: LD_LIBRARY_PATH=/tmp/vendor/lib:$LD_LIBRARY_PATH auditwheel repair --exclude libmvec.so.1 --exclude libmvec-2.so --exclude libmvec.so --exclude libmvec -w {dest_dir} {wheel}
          # CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair --add-path C:\cibw\vendor\bin -w {dest_dir} {wheel}
          CIBW_REPAIR_WHEEL_COMMAND: ""
          # CIBW_TEST_COMMAND: python -c "import dummy"
          CIBW_TEST_COMMAND: python -c "import torchcodec_ffmpeg; torchcodec_ffmpeg.install()"
        run: |
          pip install cibuildwheel delvewheel
          cibuildwheel --output-dir output
          # torchcodec-ffmpeg: the wheel is the product
          # rm -f output/*.whl
      - name: Upload FFmpeg
        uses: actions/upload-artifact@v7
        with:
          name: output-${{ matrix.os }}
          path: output/

  # torchcodec-ffmpeg: test the wheel with the latest TorchCodec and torch on
  # every platform and Python version TorchCodec publishes wheels for
  test:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
        exclude:
          # TorchCodec publishes no free-threaded wheels for Windows
          - os: windows-latest
            python: "3.14t"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Get the wheel
        uses: actions/download-artifact@v8
        with:
          name: output-${{ matrix.os }}
          path: output
      - name: Install the wheel with TorchCodec
        run: |
          # On Linux, torch from PyPI is the CUDA build; the tests need only the CPU build
          index=()
          if [ "$RUNNER_OS" = "Linux" ]; then
            index=(--index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple --index-strategy unsafe-best-match)
          fi
          uv venv --python ${{ matrix.python }} .venv-test
          uv pip install --python .venv-test "${index[@]}" torch torchcodec pytest output/*.whl
      - name: Test
        run: uv run --no-project --python .venv-test pytest -v

  # torchcodec-ffmpeg: test the wheel with each TorchCodec version that loads
  # FFmpeg 8, paired with the torch versions it supports
  test-torchcodec-versions:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { torchcodec: "0.8.1", torch: "2.9.1" }
          - { torchcodec: "0.9.1", torch: "2.9.1" }
          - { torchcodec: "0.10.0", torch: "2.10.0" }
          - { torchcodec: "0.11.0", torch: "2.11.0" }
          # TorchCodec 0.12 and later work with torch 2.11 and later
          - { torchcodec: "0.12.0", torch: "2.11.0" }
          - { torchcodec: "0.12.0", torch: "2.15.0" }
          - { torchcodec: "0.13.0", torch: "2.11.0" }
          - { torchcodec: "0.13.0", torch: "2.15.0" }
          - { torchcodec: "0.14.0", torch: "2.11.0" }
          - { torchcodec: "0.14.0", torch: "2.15.0" }
          - { torchcodec: "0.15.0", torch: "2.11.0" }
          - { torchcodec: "0.15.0", torch: "2.15.0" }
          - { torchcodec: "0.16.0", torch: "2.11.0" }
          - { torchcodec: "0.16.0", torch: "2.15.0" }
          - { torchcodec: "0.17.0", torch: "2.11.0" }
          - { torchcodec: "0.17.0", torch: "2.15.0" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Get the wheel
        uses: actions/download-artifact@v8
        with:
          name: output-ubuntu-24.04
          path: output
      - name: Install the wheel with TorchCodec
        run: |
          uv venv --python 3.12 .venv-test
          uv pip install --python .venv-test --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple --index-strategy unsafe-best-match "torch==${{ matrix.torch }}" "torchcodec==${{ matrix.torchcodec }}" pytest output/*.whl
      - name: Test
        run: uv run --no-project --python .venv-test pytest -v

  # torchcodec-ffmpeg: test that an app frozen with PyInstaller uses the
  # bundled FFmpeg, with the hooks shipped in the wheel
  test-pyinstaller:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Get the wheel
        uses: actions/download-artifact@v8
        with:
          name: output-${{ matrix.os }}
          path: output
      - name: Install the wheel with TorchCodec and PyInstaller
        run: |
          # On Linux, torch from PyPI is the CUDA build; the tests need only the CPU build
          index=()
          if [ "$RUNNER_OS" = "Linux" ]; then
            index=(--index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple --index-strategy unsafe-best-match)
          fi
          uv venv --python 3.13 .venv-test
          uv pip install --python .venv-test "${index[@]}" torch torchcodec pyinstaller pytest output/*.whl
      - name: Test
        run: uv run --no-project --python .venv-test pytest -v tests/test_pyinstaller.py

  cross-build:
    # torchcodec-ffmpeg: TorchCodec publishes no wheels for these arches
    if: false
    needs: fan
    # armv7l is cross-compiled from an aarch64 host with the arm-linux-gnueabihf
    # toolchain; the other arches cross-compile from x86_64.
    runs-on: ${{ matrix.arch == 'armv7l' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        build: [ "manylinux_", "musllinux_" ]
        # arch: [ "loongarch64", "ppc64le", "riscv64", "s390x" ]
        arch: [ "armv7l", "ppc64le", "riscv64" ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Get sources
        uses: actions/download-artifact@v8
        with:
          name: deps
          path: source
      - uses: docker/setup-qemu-action@v4
      - name: Build FFmpeg
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BEFORE_ALL_LINUX: ./scripts/install-static-clang.sh
          CIBW_BEFORE_BUILD_LINUX: python scripts/build-ffmpeg.py /tmp/vendor
          CIBW_BUILD: cp312-${{ matrix.build }}${{ matrix.arch }}
          CIBW_ENVIRONMENT_LINUX: >
            CC="/opt/clang/bin/clang"
            CXX="/opt/clang/bin/clang++"
            LDFLAGS="-fuse-ld=lld"
          CIBW_ENVIRONMENT_PASS_LINUX: RUNNER_ARCH
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: LD_LIBRARY_PATH=/tmp/vendor/lib:$LD_LIBRARY_PATH auditwheel repair --exclude libmvec.so.1 --exclude libmvec-2.so --exclude libmvec.so --exclude libmvec -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: python -c "import dummy"
        run: |
          pip install cibuildwheel delvewheel
          cibuildwheel --output-dir output
          rm -f output/*.whl
      - name: Upload FFmpeg
        uses: actions/upload-artifact@v7
        with:
          name: output-${{ matrix.build }}${{ matrix.arch }}
          path: output/

  upload-release:
    if: github.event_name == 'release'
    needs: [build, cross-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          pattern: output-*
          merge-multiple: true
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.tar.gz
